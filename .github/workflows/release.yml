name: release
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Generate completions and man
        run: |
          go build -o /tmp/rambo .
          mkdir -p completions
          /tmp/rambo completion bash > completions/rambo.bash
          /tmp/rambo completion zsh > completions/_rambo
          /tmp/rambo completion fish > completions/rambo.fish
          ls -l completions/

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}

  aur-publish:
    runs-on: ubuntu-latest
    needs: goreleaser
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Publish to AUR (fallback if GoReleaser AUR disabled)
        # If you prefer manual AUR push over GoReleaser's `aurs`, enable this:
        # Uses https://github.com/KSXGitHub/github-actions-deploy-aur
        if: false
        uses: KSXGitHub/github-actions-deploy-aur@v4
        with:
          pkgname: rambo
          pkgbuild: ./PKGBUILD
          commit_username: Jashk120
          commit_email: jashk120@example.com
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
