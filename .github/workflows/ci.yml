name: ci
on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o /tmp/rambo .
      - run: /tmp/rambo --help
      - run: /tmp/rambo version || true

  pkgbuild:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - run: pacman -Syu --noconfirm base-devel go
      - run: makepkg --printsrcinfo > /tmp/SRCINFO && cat /tmp/SRCINFO
      - run: makepkg -s --noconfirm || true
